[project]
name = "zobi-core"
version = "1.0.0"
description = "Core Python package for building ZOBI backend extensions and integrations"
readme = "README.md"
authors = [
    { name = "Zobi", email = "hafizmoazkhalid@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
keywords = ["zobi", "zobi", "analytics", "business-intelligence", "extensions", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "flask-appbuilder>=5.0.2,<6",
    "isodate>=0.7.0",
    "pyarrow>=16.0.0",
    "pydantic>=2.8.0",
    "sqlalchemy>=1.4.0,<2.0",
    "sqlalchemy-utils>=0.38.0, <0.43", # expanding lowerbound to work with pydoris
    "sqlglot>=28.10.0, <29",
    "typing-extensions>=4.0.0",
]

[project.urls]
Homepage = "https://zobi.dev/"
Documentation = "https://zobi.dev/docs/"
Repository = "https://github.com/HafizMMoaz/zobi"
"Bug Tracker" = "https://github.com/HafizMMoaz/zobi/issues"
Changelog = "https://github.com/HafizMMoaz/zobi/blob/master/CHANGELOG.md"

[build-system]
requires = ["setuptools>=76.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
