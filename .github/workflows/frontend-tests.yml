name: Frontend tests

# Jest maps @zobi.dev/* imports straight at workspace source (see the
# moduleNameMapper in frontend/jest.config.js), so packages do not need to be
# built before the suite runs.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect frontend changes (tests)
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  jest:
    name: jest (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        env:
          NODE_ENV: test
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          npx jest \
            --shard=${{ matrix.shard }}/4 \
            --coverage \
            --ci \
            --silent \
            --max-workers=2

      - name: Upload coverage to Codecov
        # .codecov.yml waits for 4 builds before notifying, matching the shard
        # count here.
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          directory: frontend/coverage
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: webpack build
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build packages and plugins
        # Same two steps the publish workflows run, so a broken package build is
        # caught before release time rather than during it.
        run: |
          npm run prune
          npm run plugins:build

      - name: Build application bundle
        run: npm run build

  tests-complete:
    name: frontend tests complete
    runs-on: ubuntu-24.04
    needs: [changes, jest, build]
    # always() is required: without it this job is skipped whenever any
    # dependency skips, and a required check that never reports blocks merges.
    if: always()
    steps:
      - name: Fail if any frontend test job failed
        run: |
          set -euo pipefail
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::a frontend test job failed"
            exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "::error::a frontend test job was cancelled"
            exit 1
          fi
          echo "frontend test jobs passed or were skipped"
