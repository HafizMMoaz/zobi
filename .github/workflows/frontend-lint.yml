name: Frontend lint

# Mirrors the frontend hooks in .pre-commit-config.yaml: oxlint, the custom rule
# checks, prettier and the TypeScript compiler.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: frontend-lint-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  changes:
    name: Detect frontend changes (lint)
    runs-on: ubuntu-24.04
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'

  lint:
    name: oxlint + custom rules
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: oxlint
        run: npm run lint

      - name: Custom rules
        run: npm run check:custom-rules

  format:
    name: prettier
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: prettier
        run: npm run prettier-check

  types:
    name: tsc
    runs-on: ubuntu-24.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # This type checks the publishable packages and plugins, which is what
      # gates the publish-* workflows, and emits their declarations.
      #
      # TODO: also run `npm run type`, which type checks the application
      # sources under frontend/src. It currently reports around 480 pre-existing
      # errors, concentrated in src/explore, src/dashboard and src/features, so
      # it cannot gate CI until those are worked through.
      - name: Build and type check packages and plugins
        run: npm run plugins:build

  lint-complete:
    name: frontend lint complete
    runs-on: ubuntu-24.04
    needs: [changes, lint, format, types]
    # always() is required: without it this job is skipped whenever any
    # dependency skips, and a required check that never reports blocks merges.
    if: always()
    steps:
      - name: Fail if any frontend lint job failed
        run: |
          set -euo pipefail
          if ${{ contains(needs.*.result, 'failure') }}; then
            echo "::error::a frontend lint job failed"
            exit 1
          fi
          if ${{ contains(needs.*.result, 'cancelled') }}; then
            echo "::error::a frontend lint job was cancelled"
            exit 1
          fi
          echo "frontend lint jobs passed or were skipped"
