[project]
name = "zobi-extensions-cli"
version = "1.0.0"
description = "Official command-line interface for building, bundling, and managing ZOBI extensions"
readme = "README.md"
authors = [
    { name = "Zobi", email = "hafizmoazkhalid@gmail.com" },
]
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.10"
keywords = ["zobi", "zobi", "cli", "extensions", "analytics", "business-intelligence", "development-tools"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Software Distribution",
]
dependencies = [
    # no bounds for zobi-core until we have a stable version
    "zobi-core",
    "click>=8.0.3",
    "jinja2>=3.1.6",
    "semver>=3.0.4",
    "tomli>=2.2.1; python_version < '3.11'",
    "tomli-w>=1.2.0",
    "watchdog>=6.0.0",
]

[project.urls]
Homepage = "https://zobi.dev/"
Documentation = "https://zobi.dev/docs/"
Repository = "https://github.com/HafizMMoaz/zobi"
"Bug Tracker" = "https://github.com/HafizMMoaz/zobi/issues"
Changelog = "https://github.com/HafizMMoaz/zobi/blob/master/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
]

[build-system]
requires = ["setuptools>=76.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zobi_extensions_cli = ["templates/**/*"]

[project.scripts]
zobi-extensions = "zobi_extensions_cli.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--cov=zobi_extensions_cli",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "cli: CLI command tests",
    "slow: Slow running tests",
]

[tool.coverage.run]
source = ["src/zobi_extensions_cli"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.ruff.lint.per-file-ignores]
"src/zobi_extensions_cli/*" = ["TID251"]
