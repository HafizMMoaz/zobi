

# -----------------------------------------------------------------------
# We don't support docker compose for production environments.
# If you choose to use this type of deployment make sure to
# create you own docker environment file (docker/.env) with your own
# unique random secure passwords and SECRET_KEY.
#
# For verbose logging during development:
# - Set ZOBI_LOG_LEVEL=debug in docker/.env-local for detailed ZOBI logs
# -----------------------------------------------------------------------
x-zobi-user: &zobi-user root
x-zobi-env: &zobi-env
  # zobi/config.py loads ZOBI_CONFIG_PATH when it is set, and otherwise falls back
  # to `import zobi_config` from the PYTHONPATH. ./docker/pythonpath_dev is already
  # bind-mounted at /app/docker/pythonpath_dev below, so adding it here is all a
  # fresh clone needs to pick up docker/pythonpath_dev/zobi_config.py - no
  # docker/.env-local required. It also makes the git-ignored
  # docker/pythonpath_dev/zobi_config_docker.py override importable.
  # /app/pythonpath is the image default (see Dockerfile) and stays first so that
  # anything mounted there still wins.
  PYTHONPATH: /app/pythonpath:/app/docker/pythonpath_dev
x-zobi-volumes: &zobi-volumes
  - ./docker:/app/docker
  - ./zobi:/app/zobi
  - ./core:/app/core
  - ./frontend:/app/frontend
  - zobi_home:/app/zobi_home
  - ./tests:/app/tests
  - zobi_data:/app/data
x-common-build: &common-build
  context: .
  target: ${ZOBI_BUILD_TARGET:-dev} # can use `dev` (default) or `lean`
  cache_from:
    - HafizMMoaz/zobi-cache:3.10-slim-trixie
  args:
    DEV_MODE: "true"
    INCLUDE_CHROMIUM: ${INCLUDE_CHROMIUM:-false}
    INCLUDE_FIREFOX: ${INCLUDE_FIREFOX:-false}
    BUILD_TRANSLATIONS: ${BUILD_TRANSLATIONS:-false}

services:
  nginx:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: nginx:latest
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis:/data

  db:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    image: postgres:17
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5433}:5432"
    volumes:
      - db_home:/var/lib/postgresql/data
      - ./docker/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d

  zobi:
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "app"]
    environment:
      <<: *zobi-env
    restart: unless-stopped
    ports:
      - ${ZOBI_PORT:-8088}:8088
      # When in cypress-mode ->
      - ${CYPRESS_PORT:-8081}:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    user: *zobi-user
    depends_on:
      zobi-init:
        condition: service_completed_successfully
    volumes: *zobi-volumes

  websocket:
    build: ./websocket
    ports:
      - ${WEBSOCKET_PORT:-8080}:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - redis
    # Mount everything in websocket into container and
    # then exclude node_modules and dist with bogus volume mount.
    # This is necessary because host and container need to have
    # their own, separate versions of these files. .dockerignore
    # does not seem to work when starting the service through
    # docker compose.
    #
    # For example, node_modules may contain libs with native bindings.
    # Those bindings need to be compiled for each OS and the container
    # OS is not necessarily the same as host OS.
    volumes:
      - ./websocket:/home/websocket
      - /home/websocket/node_modules
      - /home/websocket/dist

      # Mount config file. Create your own docker/websocket/config.json
      # for custom settings, then point to it here. Do not use this example in production.
      - ./websocket/config.json:/home/websocket/config.json:ro
    environment:
      - PORT=8080
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_SSL=false

  zobi-init:
    build:
      <<: *common-build
    command: ["/app/docker/docker-init.sh"]
    environment:
      <<: *zobi-env
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
    user: *zobi-user
    volumes: *zobi-volumes
    healthcheck:
      disable: true

  zobi-node:
    build:
      context: .
      target: zobi-node
      args:
        # This prevents building the frontend bundle since we'll mount local folder
        # and build it on startup while firing docker-frontend.sh in dev mode, where
        # it'll mount and watch local files and rebuild as you update them
        DEV_MODE: "true"
        BUILD_TRANSLATIONS: ${BUILD_TRANSLATIONS:-false}
    environment:
      <<: *zobi-env
      # set this to false if you have perf issues running the npm i; npm run dev in-docker
      # if you do so, you have to run this manually on the host, which should perform better!
      BUILD_ZOBI_FRONTEND_IN_DOCKER: true
      NPM_RUN_PRUNE: false
      SCARF_ANALYTICS: "${SCARF_ANALYTICS:-}"
      # configuring the dev-server to use the host.docker.internal to connect to the backend
      zobi: "http://zobi:8088"
      # Webpack dev server must bind to 0.0.0.0 to be accessible from outside the container
      WEBPACK_DEVSERVER_HOST: "0.0.0.0"
      # Cap the webpack dev server's V8 heap. Node sizes its default heap from
      # the memory it can see, which is the whole Docker VM, so it will happily
      # grow past what is left once Postgres, Redis, the app and the Celery
      # workers have taken their share - and then the VM OOM-kills it. Keep this
      # comfortably below (VM memory - the other services) and raise it only if
      # builds start failing with "JavaScript heap out of memory".
      ZOBI_NODE_HEAP_MB: "${ZOBI_NODE_HEAP_MB:-3072}"
    ports:
      - "127.0.0.1:${NODE_PORT:-9000}:9000"  # exposing the dynamic webpack dev server
    command: ["/app/docker/docker-frontend.sh"]
    # Without this, an OOM kill leaves the frontend silently dead: the backend
    # keeps serving, so the only symptom is a browser that stops picking up
    # changes. Every other long-running service here restarts the same way.
    restart: unless-stopped
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    volumes: *zobi-volumes

  zobi-worker:
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    environment:
      <<: *zobi-env
      CELERYD_CONCURRENCY: 2
    restart: unless-stopped
    depends_on:
      zobi-init:
        condition: service_completed_successfully
    user: *zobi-user
    volumes: *zobi-volumes
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "celery -A zobi.tasks.celery_app:app inspect ping -d celery@$$HOSTNAME"]
    # Bump memory limit if processing selenium / thumbnails on zobi-worker
    # mem_limit: 2038m
    # mem_reservation: 128M

  zobi-worker-beat:
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "beat"]
    environment:
      <<: *zobi-env
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    restart: unless-stopped
    depends_on:
      - zobi-worker
    user: *zobi-user
    volumes: *zobi-volumes
    healthcheck:
      disable: true

  zobi-tests-worker:
    build:
      <<: *common-build
    command: ["/app/docker/docker-bootstrap.sh", "worker"]
    env_file:
      - path: docker/.env # default
        required: true
      - path: docker/.env-local # optional override
        required: false
    profiles:
      - optional
    environment:
      <<: *zobi-env
      DATABASE_HOST: localhost
      DATABASE_DB: test
      REDIS_CELERY_DB: 2
      REDIS_RESULTS_DB: 3
      REDIS_HOST: localhost
      CELERYD_CONCURRENCY: 8
    network_mode: host
    depends_on:
      zobi-init:
        condition: service_completed_successfully
    user: *zobi-user
    volumes: *zobi-volumes
    healthcheck:
      test: ["CMD-SHELL", "celery inspect ping -A zobi.tasks.celery_app:app -d celery@$$HOSTNAME"]

volumes:
  zobi_home:
    external: false
  db_home:
    external: false
  redis:
    external: false
  zobi_data:
    external: false
